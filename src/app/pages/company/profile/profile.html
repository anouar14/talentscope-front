<div class="profile-page">
  <div class="profile-card">

    <div class="profile-header">
      <div class="avatar">
        {{ company.companyName ? company.companyName.charAt(0) : 'E' }}
      </div>

      <h1>Profil entreprise</h1>
      <p>Complétez les informations de votre entreprise.</p>
    </div>

    <div *ngIf="loading" class="info-message">
      Chargement du profil...
    </div>

    <form *ngIf="!loading" (ngSubmit)="saveProfile()">

      <div class="form-grid">
        <div class="form-group full">
          <label>Nom de l’entreprise</label>
          <input type="text" name="companyName" [(ngModel)]="company.companyName">
        </div>

        <div class="form-group">
          <label>Secteur</label>
          <input type="text" name="sector" [(ngModel)]="company.sector" placeholder="Ex: Télécommunications">
        </div>

        <div class="form-group">
          <label>Localisation</label>
          <input type="text" name="location" [(ngModel)]="company.location" placeholder="Ex: Tunis">
        </div>

        <div class="form-group full">
          <label>Site web</label>
          <input type="text" name="website" [(ngModel)]="company.website" placeholder="https://www.exemple.com">
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea name="description" [(ngModel)]="company.description" rows="5"></textarea>
        </div>
      </div>

      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="save-btn" type="submit" [disabled]="saving">
        {{ saving ? 'Enregistrement...' : 'Enregistrer le profil' }}
      </button>

    </form>
  </div>
</div>
