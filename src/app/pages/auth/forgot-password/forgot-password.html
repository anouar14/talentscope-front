<div class="auth-page">
  <div class="auth-card">
    <h1>Mot de passe oublié</h1>

    <p class="description">
      Saisissez votre adresse email. Si un compte TalentScope
      lui est associé, vous recevrez un lien de réinitialisation.
    </p>

    <form
      #forgotPasswordForm="ngForm"
      (ngSubmit)="onSubmit(forgotPasswordForm)"
      novalidate
    >
      <label for="email">Adresse email</label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        #emailField="ngModel"
        placeholder="exemple@email.com"
        required
        email
        maxlength="150"
        autocomplete="email"
      />

      <div
        class="field-error"
        *ngIf="
          emailField.invalid &&
          (emailField.touched || submitted)
        "
      >
        <span *ngIf="emailField.errors?.['required']">
          L’adresse email est obligatoire.
        </span>

        <span *ngIf="emailField.errors?.['email']">
          Le format de l’adresse email est invalide.
        </span>
      </div>

      <p
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </p>

      <p
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{
          loading
            ? 'Envoi en cours...'
            : 'Envoyer le lien'
        }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">
        Retour à la connexion
      </a>
    </div>
  </div>
</div>
